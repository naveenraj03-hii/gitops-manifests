apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Naveen Tech School</title>
      <style>
        :root {
          color-scheme: dark;
          --bg: #07111c;
          --panel: #102231;
          --text: #f4f7f5;
          --muted: #9db0ba;
          --accent: #d6f54a;
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: radial-gradient(
            circle at 80% 10%,
            #173b4a,
            transparent 35%
          ), var(--bg);
          color: var(--text);
          font-family: Arial, sans-serif;
        }

        .card {
          width: min(720px, 100%);
          padding: 48px;
          border: 1px solid #294354;
          background: rgba(16, 34, 49, .92);
          border-radius: 16px;
          box-shadow: 0 24px 70px rgba(0,0,0,.3);
        }

        .label {
          color: var(--accent);
          font: 700 12px/1.4 monospace;
          letter-spacing: .18em;
          text-transform: uppercase;
        }

        h1 {
          margin: 16px 0;
          font-size: clamp(52px, 11vw, 112px);
          line-height: .88;
          letter-spacing: -.075em;
        }

        h1 span {
          color: var(--accent);
        }

        p {
          max-width: 560px;
          color: var(--muted);
          font-size: 18px;
          line-height: 1.7;
        }

        .topics {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-top: 28px;
        }

        .topics span {
          padding: 10px 12px;
          border: 1px solid #3b5869;
          border-radius: 999px;
          color: #dbe7eb;
          font: 14px monospace;
        }

        .status {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-top: 34px;
          color: var(--accent);
          font: 13px monospace;
        }

        .dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--accent);
        }
      </style>
    </head>

    <body>
      <main class="card">

        <div class="label">
          Naveen Tech School / learning online
        </div>

        <h1>
          Naveen<br>
          <span>Tech School</span>
        </h1>

        <p>
          Build practical skills in AWS, Cloud, DevOps, Kubernetes, and Helm.
          Start with simple projects and grow toward production-ready systems.
        </p>

        <div class="topics">
          <span>AWS</span>
          <span>Cloud</span>
          <span>DevOps</span>
          <span>Kubernetes</span>
          <span>Helm</span>
        </div>

        <div class="status">
          <span class="dot"></span>
          DEPLOYMENT READY
        </div>

      </main>
    </body>
    </html>